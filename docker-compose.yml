version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: expensedb
    environment:
      POSTGRES_DB: expensedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/expense-platform-api
    container_name: expense-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/expensedb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      FLYWAY_URL: jdbc:postgresql://postgres:5432/expensedb
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
      JWT_SECRET: dev-docker-jwt-secret-at-least-32-characters-long
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend/expense-platform-web
      args:
        VITE_API_URL: http://localhost:8080
    container_name: expense-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data: