spring.application.name=expense-platform-api

# Database - Railway injects SPRING_DATASOURCE_* env vars
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/expensedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Port - Railway injects PORT; local dev falls back to 8080
server.port=${PORT:8080}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.open-in-view=false

# JWT - Railway injects JWT_SECRET; local dev falls back to this dev value
app.jwt.secret=${JWT_SECRET:this-is-a-dev-secret-key-change-me-in-production-at-least-32-chars-long}
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}